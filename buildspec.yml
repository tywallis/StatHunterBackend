version: 0.2

phases:
  install:
    runtime-versions:
       python: 3.12
  pre_build:
    commands:
      - python3 --version
      - pip3 install --upgrade pip
      - pip3 install --upgrade awscli
      - sudo docker info
  build:
    commands:
      - echo Build started on `date`
      - echo Building the Docker image...
      - ls
      - docker build -t stat-hunter:$CODEBUILD_BUILD_NUMBER .
      - docker container ls
  post_build:
    commands:
      - echo Build completed on `date`
      - echo Pushing the Docker image...
      - docker tag stat-hunter:$CODEBUILD_BUILD_NUMBER 864981721755.dkr.ecr.us-east-1.amazonaws.com/stat-hunter:$CODEBUILD_BUILD_NUMBER
      - docker push 864981721755.dkr.ecr.us-east-1.amazonaws.com/stat-hunter:$CODEBUILD_BUILD_NUMBER